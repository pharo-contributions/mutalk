name: Pharo release
description: >-
  Publish a Semantic Versioning tag as a GitHub Release with a machine-readable
  HTML release index (index.html), for Pharo repositories. The source
  repository location is read from the Pharo project metadata file (e.g.
  .project).

inputs:
  tag:
    description: >-
      Tag being released (e.g. `2.7.0` or `v2.7.0`). When empty, the tag that
      triggered the workflow is used.
    required: false
    default: ''
  project-file:
    description: >-
      Location of the Pharo project metadata file (`.project`), relative to the
      repository root. The source repository location it describes is resolved
      relative to this file's directory.
    required: false
    default: .project
  logo:
    description: >-
      Optional logo path or URL for the generated release index. Local image
      files are embedded in the generated HTML.
    required: false
    default: ''

outputs:
  version:
    description: 'Normalized SemVer version that was released.'
    value: ${{ steps.resolve.outputs.version }}
  url:
    description: 'URL of the created GitHub Release.'
    value: ${{ steps.publish.outputs.url }}

runs:
  using: composite
  steps:
    - name: Resolve and validate the version tag
      id: resolve
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        TRIGGER_TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        tag="${INPUT_TAG}"
        if [ -z "${tag}" ]; then
          tag="${TRIGGER_TAG}"
        fi
        version="$(python3 "${GITHUB_ACTION_PATH}/scripts/semver.py" "${tag}")"
        echo "tag=${tag}" >> "${GITHUB_ENV}"
        echo "version=${version}" >> "${GITHUB_ENV}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "releasing ${version} (tag ${tag})"

    - name: Read Pharo project metadata
      shell: bash
      run: |
        set -euo pipefail
        project_file="${{ inputs.project-file }}"
        python3 "${GITHUB_ACTION_PATH}/scripts/metadata.py" \
          --project-file "${project_file}" > "${RUNNER_TEMP}/project.json"
        package="$(jq -r '.package' "${RUNNER_TEMP}/project.json")"
        echo "package=${package}" >> "${GITHUB_ENV}"

    - name: Discover existing releases (GitHub REST API)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api --paginate -H "Accept: application/vnd.github+json" \
          "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
          | jq -s 'add // []' > "${RUNNER_TEMP}/releases.json"

    - name: Resolve the previous release and generate GitHub release notes
      shell: bash
      env:
        VERSION_TAG: ${{ env.tag }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        previous="$(python3 "${GITHUB_ACTION_PATH}/scripts/previous_version.py" \
          --releases-file "${RUNNER_TEMP}/releases.json" --tag "${VERSION_TAG}")"
        echo "previous=${previous}" >> "${GITHUB_ENV}"
        notes_args=(
          --method POST
          -f "tag_name=${VERSION_TAG}"
          -f "target_commitish=${VERSION_TAG}"
        )
        if [ -n "${previous}" ]; then
          notes_args+=( -f "previous_tag_name=${previous}" )
        fi
        gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
          "${notes_args[@]}" --jq .body > "${RUNNER_TEMP}/CHANGELOG.md"

    - name: Build the neutral release metadata
      shell: bash
      env:
        VERSION_TAG: ${{ env.tag }}
        PYTHONPATH: ${{ github.action_path }}/scripts
      run: |
        set -euo pipefail
        release_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        python3 "${GITHUB_ACTION_PATH}/scripts/gh_adapter.py" \
          --releases-file "${RUNNER_TEMP}/releases.json" \
          --tag "${VERSION_TAG}" \
          --version "${version}" \
          --date "${release_date}" \
          --project-name "${package}" \
          --package "${package}" \
          --repository "${GITHUB_REPOSITORY}" \
          --changes-file "${RUNNER_TEMP}/CHANGELOG.md" \
          --previous-output "${RUNNER_TEMP}/previous.txt" \
          --output "${RUNNER_TEMP}/release.json" > /dev/null
        echo "release_date=${release_date}" >> "${GITHUB_ENV}"

    - name: Install the index generator dependency
      shell: bash
      run: python3 -m pip install --quiet markdown

    - name: Generate the release index (index.html)
      shell: bash
      env:
        LOGO: ${{ inputs.logo }}
      run: |
        set -euo pipefail
        readme_args=( )
        logo_args=( )
        if [ -f "${GITHUB_WORKSPACE}/README.md" ]; then
          readme_args=( --readme "${GITHUB_WORKSPACE}/README.md" )
        fi
        if [ -n "${LOGO}" ]; then
          logo_args=( --logo "${LOGO}" )
        fi
        python3 "${GITHUB_ACTION_PATH}/scripts/index.py" \
          --metadata "${RUNNER_TEMP}/release.json" \
          "${readme_args[@]}" \
          "${logo_args[@]}" \
          --output "${RUNNER_TEMP}/release-assets/index.html"

    - name: Publish the GitHub release
      id: publish
      shell: bash
      env:
        VERSION_TAG: ${{ env.tag }}
        PACKAGE: ${{ env.package }}
        VERSION: ${{ env.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        prerelease_args=( )
        case "${VERSION}" in
          *-*) prerelease_args=( --prerelease ) ;;
        esac
        gh release create "${VERSION_TAG}" \
          "${RUNNER_TEMP}/release-assets/index.html" \
          --title "${PACKAGE} ${VERSION}" \
          --notes-file "${RUNNER_TEMP}/CHANGELOG.md" \
          --verify-tag \
          "${prerelease_args[@]}"
        echo "url=$(gh release view "${VERSION_TAG}" --json url --jq .url)" >> "${GITHUB_OUTPUT}"

    - name: Upload run artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pharo-release-artifacts
        path: ${{ runner.temp }}/release-assets
        if-no-files-found: error